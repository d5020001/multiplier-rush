<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplier Rush</title>
    <!-- Подключаем официальную библиотеку Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }
        .score-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid #e94560;
        }
        .multiplier {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            animation: popIn 0.2s ease-out;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .multiplier.good {
            background: linear-gradient(135deg, #00b894, #00cec9);
            border: 3px solid #55efc4;
            color: #fff;
        }
        .multiplier.bomb {
            background: linear-gradient(135deg, #d63031, #e17055);
            border: 3px solid #ff7675;
            color: #fff;
            font-size: 40px;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
        .floating-text {
            position: absolute;
            color: #55efc4;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
            text-shadow: 1px 1px 3px black;
        }
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        h1 { color: #e94560; margin-bottom: 10px; font-size: 36px; text-align: center;}
        p { color: #ccc; margin-bottom: 30px; text-align: center; padding: 0 20px;}
        button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #e94560;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            z-index: 30;
            border: 2px solid #e94560;
            width: 80%;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div class="score-box" id="score">Очки: 0</div>
            <div class="score-box" id="timer">Время: 30</div>
        </div>

        <div id="start-screen">
            <h1>Multiplier Rush</h1>
            <p>Ловите зеленые множители и избегайте бомб!<br>У вас есть 30 секунд.</p>
            <button onclick="startGame()">Играть</button>
        </div>

        <div id="game-over">
            <h2 style="color: #e94560; margin-top:0;">Игра окончена!</h2>
            <p style="font-size: 24px; color: white;">Ваш счет: <span id="final-score">0</span></p>
            <button onclick="startGame()">Еще раз</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
            // Настраиваем цвет "шапки" Telegram под цвет игры
            tg.setHeaderColor('#1a1a2e');
        }

        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let spawnTimeout;
        let isPlaying = false;

        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');

        function startGame() {
            score = 0;
            timeLeft = 30;
            isPlaying = true;
            updateUI();
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // Очищаем поле от старых элементов
            document.querySelectorAll('.multiplier, .floating-text').forEach(el => el.remove());

            // Таймер
            clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                timeLeft--;
                updateUI();
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Спавн элементов
            spawnLoop();
        }

        function spawnLoop() {
            if (!isPlaying) return;
            
            spawnItem();
            
            // Скорость спавна зависит от оставшегося времени (ускоряется к концу)
            let nextSpawn = Math.max(300, 800 - (30 - timeLeft) * 15);
            spawnTimeout = setTimeout(spawnLoop, nextSpawn);
        }

        function spawnItem() {
            const isBomb = Math.random() < 0.3; // 30% шанс бомбы
            const el = document.createElement('div');
            el.className = `multiplier ${isBomb ? 'bomb' : 'good'}`;
            
            if (isBomb) {
                el.innerText = '💥';
            } else {
                // Случайный множитель от 1 до 5
                const mult = Math.floor(Math.random() * 5) + 1;
                el.innerText = `x${mult}`;
                el.dataset.value = mult;
            }

            // Позиция (не заходя за края экрана)
            const maxX = window.innerWidth - 100;
            const maxY = window.innerHeight - 150;
            const x = Math.max(20, Math.random() * maxX);
            const y = Math.max(100, Math.random() * maxY);
            
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;

            // Обработка нажатия
            el.addEventListener('touchstart', handleTap, {passive: true});
            el.addEventListener('mousedown', handleTap); // Для теста в браузере

            container.appendChild(el);

            // Удаляем, если не нажали за 1.5 секунды
            setTimeout(() => {
                if (el.parentNode) {
                    el.remove();
                }
            }, 1500);
        }

        function handleTap(e) {
            e.preventDefault(); // Убираем задержки
            const el = e.target.closest('.multiplier');
            if (!el || !isPlaying) return;

            if (el.classList.contains('bomb')) {
                // Попались на бомбу
                timeLeft = Math.max(0, timeLeft - 5);
                showFloatingText('-5 сек', el.style.left, el.style.top, '#ff7675');
                // Вибрация в телефоне (если поддерживается)
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            } else {
                // Собрали множитель
                const val = parseInt(el.dataset.value);
                score += val * 10;
                showFloatingText(`+${val * 10}`, el.style.left, el.style.top, '#55efc4');
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }
            
            updateUI();
            el.remove();
        }

        function showFloatingText(text, x, y, color) {
            const floating = document.createElement('div');
            floating.className = 'floating-text';
            floating.innerText = text;
            floating.style.color = color;
            floating.style.left = x;
            floating.style.top = y;
            container.appendChild(floating);
            setTimeout(() => floating.remove(), 800);
        }

        function updateUI() {
            scoreEl.innerText = `Очки: ${score}`;
            timerEl.innerText = `Время: ${timeLeft}`;
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearTimeout(spawnTimeout);
            
            document.querySelectorAll('.multiplier').forEach(el => el.remove());
            
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'block';
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }
    </script>
</body>
  </html>
